# Caller for the shared workflow in AIRclub-UdeSA/.github
# Setup checklist: https://github.com/AIRclub-UdeSA/.github/blob/main/CONTRIBUTING.md#setting-up-a-new-repository
name: Add to project

on:
  issues:
    types: [opened]
  # pull_request_target (not pull_request): fork PRs get no repo secrets on
  # pull_request, so the App token step fails for every external
  # contribution. Safe here because this workflow never checks out the
  # fork's code and only calls the Projects GraphQL API.
  pull_request_target:
    types: [opened]

jobs:
  add-to-project:
    uses: AIRclub-UdeSA/.github/.github/workflows/add-to-project.yml@main
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
