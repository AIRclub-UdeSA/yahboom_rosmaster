[workspace]
name = "yahboom_rosmaster"
version = "1.0.0"
description = "RoboStack (conda) environment for the Yahboom ROSMASTER X3 simulation on macOS"
authors = ["AIRclub UdeSA"]
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
# --- ROS 2 Humble core + GUI tools (RViz2, rqt, common messages) ---
ros-humble-desktop = "*"

# --- Gazebo Fortress integration (README-supported pairing) ---
ros-humble-ros-gz-sim = "*"
ros-humble-ros-gz-bridge = "*"
ros-humble-ros-gz-image = "*"
ros-humble-ros-gz-interfaces = "*"
ros-humble-gz-ros2-control = "*"

# --- Control stack ---
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-controller-manager = "*"
ros-humble-ros2controlcli = "*"

# --- Navigation / localization ---
ros-humble-navigation2 = "*"
ros-humble-nav2-bringup = "*"
ros-humble-nav2-simple-commander = "*"
ros-humble-slam-toolbox = "*"
ros-humble-robot-localization = "*"

# --- Perception / docking ---
ros-humble-apriltag-ros = "*"
ros-humble-image-proc = "*"

# --- Model / TF utilities ---
ros-humble-xacro = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-joint-state-publisher-gui = "*"
ros-humble-tf-transformations = "*"
ros-humble-topic-tools = "*"
ros-humble-rviz-imu-plugin = "*"
ros-humble-rqt-robot-steering = "*"

# --- Python runtime deps (package.xml: python3-numpy, python3-yaml) ---
numpy = "*"
pyyaml = "*"
setuptools = "*"

# --- Build toolchain ---
colcon-common-extensions = "*"
compilers = "*"
cmake = "3.*"
make = "*"
ninja = "*"
pkg-config = "*"

[tasks]
# Python_FIND_VIRTUALENV=ONLY keeps CMake's FindPython inside the conda env;
# without it, packages with pre-3.15 cmake_minimum_required scan newest-first
# and latch onto Homebrew/system Python frameworks (missing NumPy) on macOS.
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
clean = "rm -rf build install log"
stop = "bash scripts/stop_sim.sh"

[tasks.sim]
cmd = "ros2 launch yahboom_rosmaster_gazebo rosmaster_gazebo_fortress.launch.py"
depends-on = []

[tasks.sim-headless]
cmd = "ros2 launch yahboom_rosmaster_gazebo rosmaster_gazebo_fortress.launch.py rviz:=false headless:=true"

[activation]
scripts = ["scripts/pixi_activate.sh"]

# ---------------------------------------------------------------------------
# Gazebo Classic backend (macOS).
#
# Fortress on macOS cannot open its GUI or run any rendering sensor, so there is
# no LiDAR and no camera. Gazebo Classic opens its GUI and its CPU raycast lidar
# needs no rendering, which is what makes SLAM and Nav2 possible here.
#
# It has to be a separate environment: ros-humble-gazebo-ros-pkgs and
# ros-humble-ros-gz cannot be solved together (conflicting assimp pins), and the
# Classic build of gazebo carries `libgz-tools < 0.0.0`.
# ---------------------------------------------------------------------------
[feature.classic.dependencies]
ros-humble-ros-base = "*"
ros-humble-ros2cli-common-extensions = "*"
ros-humble-gazebo-ros-pkgs = ">=3.9.0"
ros-humble-rviz2 = "*"
ros-humble-xacro = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-navigation2 = "*"
ros-humble-nav2-bringup = "*"
ros-humble-slam-toolbox = "*"
ros-humble-teleop-twist-keyboard = "*"
ros-humble-tf2-tools = "*"
ros-humble-tf-transformations = "*"
numpy = "*"
pyyaml = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "3.*"
make = "*"
pkg-config = "*"

[feature.classic.tasks]
# Separate build/install trees so the two backends never overwrite each other.
# Only the packages this backend uses. The rest need ros2_control and
# robot_localization, which belong to the Fortress environment.
# yahboom_rosmaster_docking is included because the Nav2 params reference its
# dock_database.yaml through $(find-pkg-share ...).
# Names are distinct from the default environment's tasks, so `pixi run
# build-classic` picks the classic environment on its own and plain
# `pixi run build` stays unambiguously Fortress.
build-classic = "colcon build --symlink-install --build-base build_classic --install-base install_classic --packages-select yahboom_rosmaster_msgs yahboom_rosmaster_description yahboom_rosmaster_gazebo yahboom_rosmaster_navigation yahboom_rosmaster_docking --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
sim-classic = "ros2 launch yahboom_robostack_M_silycon/launch/simulation.launch.py"
sim-classic-headless = "ros2 launch yahboom_robostack_M_silycon/launch/simulation.launch.py gui:=false rviz:=false"
slam = "ros2 launch yahboom_robostack_M_silycon/launch/slam_nav2.launch.py"
nav2 = "ros2 launch yahboom_robostack_M_silycon/launch/slam_nav2.launch.py nav2:=true"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard"
stop-classic = "bash scripts/stop_sim.sh"
clean-classic = "rm -rf build_classic install_classic log"

[feature.classic.activation]
scripts = ["yahboom_robostack_M_silycon/scripts/activate.sh"]

[environments]
classic = { features = ["classic"], no-default-feature = true }
