# Sensor quality and timing profiles for the Gazebo Fortress simulator.
#
# Selected with the `sensor_profile` launch argument (yahboom_rosmaster#43,
# decision D1): `physical` is the default and models what the physical X3
# delivers; `ideal` keeps every frame, undelayed and undegraded, for geometry
# and determinism tests. A profile changes quality and timing, never the
# interface: topics, frames and layouts are the same under both.
#
# The file is organized by sensor. Step 7 of #43 added `depth`; step 8 adds
# `lidar` and `imu`. Every value is a mapping with the value and the source of its
# measurement, so a number can be traced back to the capture behind it.
# scripts/sensor_profiles.py loads and validates it; test/sensor_profiles_test.py
# checks the values against the physical measurement.

version: 1

point_cloud:
  physical:
    frame_period_s:
      value: 0.033
      source: >
        The simulated camera's own frame clock, not a physical measurement:
        update_rate 30 with the 1 ms physics step fires every 33 ms of sim
        time, so the image stamps run at 30.3 Hz (config/real_robot_contract.yaml,
        #43 step 5). The physical robot's frames are 33.3 ms apart. The gap
        counts below are whole frames, so they convert to time with this period.
    latency_s:
      value: 0.050
      source: >
        physical_rosmaster#45, docs/sensor_capabilities.md "Point cloud",
        measured 2026-09-24 on x3-c at physical_rosmaster b144d31: about 50 ms,
        run medians 43-53 ms, per-run standard deviation 1-3 ms, treated as
        constant. A cloud leaves this long after the stamp of its frame, which
        it keeps.
    gap_frames:
      value:
        1: 0.3310
        2: 0.1852
        3: 0.1538
        4: 0.0901
        5: 0.0526
        6: 0.0466
        7: 0.0283
        8: 0.0223
        9: 0.0202
        10: 0.0132
        11: 0.0132
        12: 0.0061
        13: 0.0091
        14: 0.0051
        15: 0.0040
        16: 0.0010
        17: 0.0040
        18: 0.0040
        19: 0.0020
        20: 0.0020
        23: 0.0010
        24: 0.0010
        25: 0.0010
        28: 0.0010
        32: 0.0010
        34: 0.0010
      source: >
        physical_rosmaster#45, "Frames from one cloud to the next": 988 stamp
        gaps pooled from three settled 40 s runs on the public topic, measured
        2026-09-24 on x3-c at physical_rosmaster b144d31. Every gap was a whole
        number of 33.3 ms camera frames, and consecutive gaps were uncorrelated
        (lag-1 autocorrelation 0.01-0.06), so each gap is drawn independently.
        The probabilities are the published four-decimal values, which sum to
        0.9998; the sampler normalizes them. The median is 2 frames, the p95 is
        11, the longest 34 and the mean 3.63.

  ideal:
    frame_period_s:
      value: 0.033
      source: The same simulated camera frame clock as the physical profile.
    latency_s:
      value: 0.0
      source: >
        By definition (#43 decision D1): every cloud is published as soon as it
        is built.
    gap_frames:
      value:
        1: 1.0
      source: >
        By definition (#43 decision D1): every camera frame becomes a cloud.

depth:
  physical:
    scale_error:
      value: -0.011858
      source: >
        physical_rosmaster docs/depth_camera_calibration.md "Scale", wall fits of
        2026-09-18 (read at physical_rosmaster 468662c). The camera under-reports
        depth: the doc records -1.1% to -1.3% (four low-yaw positions gave
        -0.94, -1.10, -1.23 and -1.18%; the ledger's physical range) and says to
        correct with "true ~= reported * 1.012". The simulator applies the
        inverse of that recommended correction, reported = true / 1.012, which
        is a scale error of -0.011858 (-1.1858%). The linear fit's slope gave
        -1.33%, just outside the recorded range; the doc puts the spread across
        positions at 0.3%.
    noise_sigma_floor_m:
      value: 0.002
      source: >
        docs/depth_camera_calibration.md "Noise": measured noise flattens at a
        floor of about 2 mm below roughly 1.1 m (0.13 to 0.25 cm at 0.45 to 1.12
        m), so sigma = max(0.002, 0.0019 * d^2.36) m. Distances in that table
        are the reported ones, so sigma takes the scaled depth (#43 step 7).
    noise_sigma_coefficient:
      value: 0.0019
      source: >
        docs/depth_camera_calibration.md "Noise": above about 1.1 m the residual
        RMS about the fitted plane (0.57, 1.84 and 3.93 cm at 1.63, 2.60 and 3.60
        m) is a power law, sigma ~= 0.0019 * d^2.36 m, four points within 7%.
        EXTRAPOLATED beyond 3.6 m, the farthest distance the doc calibrates: the
        law gives about 12 cm at 5.8 m (the deepest return in camera_public.json)
        and about 25 cm at the simulator's 8 m far clip, which nothing measured.
    noise_sigma_exponent:
      value: 2.36
      source: >
        docs/depth_camera_calibration.md "Noise", the exponent of the fit above;
        the doc notes that a textbook d^2 understates noise at 3.5 m by about
        40%. Extrapolated beyond 3.6 m like the coefficient.
    min_range_m:
      value: 0.6
      source: >
        docs/depth_camera_calibration.md "Range limits and dropout": usable range
        starts at about 0.6 m, matching the Astra family's published minimum; at
        0.63 m reported 61.1% of pixels were valid, at 0.45 m 35.4%. The doc
        tabulates reported distance, so the simulator publishes NaN for any
        depth below this after scale and noise. The close-range wedge and the
        floor dropout are not modelled (yahboom_rosmaster#59).

  ideal:
    scale_error:
      value: 0.0
      source: >
        By definition (#43 decision D1), the rendered depth, undegraded.
    noise_sigma_floor_m:
      value: 0.0
      source: >
        By definition (#43 decision D1), no noise.
    noise_sigma_coefficient:
      value: 0.0
      source: >
        By definition (#43 decision D1), no noise.
    noise_sigma_exponent:
      value: 2.36
      source: >
        Unused while the floor and coefficient are zero; the physical profile's
        exponent, so the two profiles carry the same keys.
    min_range_m:
      value: 0.0
      source: >
        By definition (#43 decision D1): no cutoff beyond the camera's own near
        clip. Every finite pixel is published bit for bit; only the non-finite
        ones become NaN, in both profiles.
