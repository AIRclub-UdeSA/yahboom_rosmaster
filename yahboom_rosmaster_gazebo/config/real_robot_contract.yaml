legacy_bag_audit:
  confidence: measured
  source: >
    bags_x3.zip: 5 ROS 2 Humble sqlite3 bags, about 62 minutes and 425,513
    messages, recorded with the vendor software stack that physical_rosmaster
    has since replaced. The archive is untracked (see .gitignore). Regenerate
    with scripts/real_robot_bag_analyzer.py, which reads only this bag format.
  bags:
    bag_x3_5: {description: Mapping run, duration_s: 965.9, message_count: 110507, motion_valid: false}
    bag_x3_6: {description: Mapping run, duration_s: 802.2, message_count: 93002, motion_valid: true}
    bag_x3_7: {description: Mapping run, duration_s: 895.7, message_count: 104934, motion_valid: true}
    bag_x3_8_cones: {description: Blue and red cones course, duration_s: 531.1, message_count: 58900, motion_valid: true}
    bag_x3_9_obstacles: {description: Cones and obstacles course, duration_s: 548.0, message_count: 58170, motion_valid: true}
  bag_x3_5_note: >
    Odometry path length is exactly zero and the IMU is constant for the whole
    bag while /cmd_vel and /scan keep changing. Excluded from every motion and
    noise statistic.

  # Kept: nothing newer measures these.
  cmd_vel:
    rate_hz: {min: 41.2, max: 62.8}
    observed_p90: {linear_x: 0.2, linear_y: 0.18, angular_z: 1.0}
    note: Rate varies by bag and source (teleop or autonomous driving); no header.
  command_response:
    confidence: manual_audit
    method: >
      Stable command-window segmentation: windows where /cmd_vel held a
      constant single-axis value, then the steady-state median of the reported
      /odom twist on that axis. Not reproduced by real_robot_bag_analyzer.py.
      It describes the vendor estimator's reported behavior, not true motion:
      the bags have no ground truth.
    samples:
      - {cmd_vx: 0.1, reported_vx: 0.0957}
      - {cmd_vx: 0.2, reported_vx: 0.1896}
      - {cmd_vx: 0.3, reported_vx: 0.2906}
      - {cmd_vx: -0.1, reported_vx: -0.0727}
      - {cmd_vx: -0.2, reported_vx: -0.1776}
      - {cmd_wz: 1.0, reported_wz: 0.685}
      - {cmd_wz: -1.0, reported_wz: -0.507}
      - {cmd_vy: [0.1, -0.1], reported_vy: ~0.0}
  calibration_gaps:
    confidence: absent
    missing:
      - independent external pose (map, world, mocap, AprilTag or GPS)
    resolved:
      - >
        Wheel encoder feedback: /joint_states now reports real positions and
        velocities (physical.joint_states), so the bags' "always zero"
        placeholder no longer applies.
    blocks:
      - true longitudinal or lateral slip
      - per-wheel traction differences
      - true endpoint or trajectory error
      - a defensible mu, mu2, slip1 or slip2 for the Gazebo stress profile
    tracked_in: >
      #17 (drivetrain and rotation calibration), blocked on
      AIRclub-UdeSA/physical_rosmaster#35 and #36.

  # Superseded: a newer physical measurement or configuration replaced each of
  # these. Keep them for history only.
  superseded:
    base_footprint_to_base_link_z_m:
      value: 0.0815
      superseded_by: physical.frames.base_footprint_to_base_link_z_m
      note: >
        From the pre-PR-#31 physical description recorded in the bags. Its
        camera would sit 119.1 mm above the floor; the tape measured 105-109.
    joint_states:
      value: {names: [front_right_joint, front_left_joint, back_right_joint, back_left_joint], position: always_zero, velocity: never_reported}
      superseded_by: physical.joint_states
    odom_covariance:
      value: {pose_xx_yy: 0.000854, pose_yawyaw: 0.000648, behavior: dynamic}
      superseded_by: physical.odometry
      note: >
        The vendor estimator also reported near-zero lateral twist while
        strafing. The current base_node_X3 computes odometry from the wheel
        encoders instead; lateral twist has not been re-measured.
    scan_rate_hz:
      value: 7.40
      superseded_by: physical.topics./scan.rate_hz
    imu_stationary_noise:
      value: {gyro_xy_rad_s: [0.0075, 0.0121], gyro_z_rad_s: [0.0184, 0.0263], accel_mps2: [0.15, 0.31]}
      superseded_by: physical.imu.gyro_noise_stddev_rad_s
      note: Upper bounds from low-motion windows, not a controlled capture.
    imu_gravity_magnitude_mps2:
      value: [9.800, 9.848]
      superseded_by: physical.imu.gravity_magnitude_mps2
    camera:
      value: {topics: [/image_raw, /camera_info], frame_id: default_cam, encoding: yuv422_yuy2, dimensions: [320, 240], rate_hz: 10.0, k_matrix: all_zero}
      superseded_by: physical.camera
      note: The vendor UVC camera node; physical_rosmaster now publishes the Astra RGB-D contract.
    wheel_and_sensor_geometry:
      value: {wheel_x_offset_m: 0.08, wheel_y_offset_m: [-0.0845, 0.084492], camera_link_xyz: [0.057105, 0.0000179, 0.03755]}
      superseded_by: physical.frames.mounts
